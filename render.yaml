# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Import this repo on Render as a Blueprint and it picks these settings up
# automatically. The rewrite is the part that matters: without it every locale
# path (/fr, /de, /ja, …) and every deep link 404s on direct navigation, because
# only index.html exists on disk. public/.htaccess does this job on Apache and
# has no effect on Render.
services:
  - type: web
    name: netpulse
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Feeds canonical URLs, hreflang, structured data and the share card.
      # Point both at the final domain before going live — leaving them unset
      # makes every canonical claim netpulse.app, a site you do not control.
      - key: VITE_SITE_ORIGIN
        sync: false
      - key: SITE_ORIGIN
        sync: false

    headers:
      # Hashed filenames, safe to cache forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The HTML entry point must revalidate or users get a stale app shell
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()

    routes:
      # Real files win; everything else falls through to the SPA shell
      - type: rewrite
        source: /*
        destination: /index.html
